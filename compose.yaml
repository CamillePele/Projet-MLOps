services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Lightweight Database Management
  adminer:
    image: adminer:latest
    container_name: mlops-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      postgres:
        condition: service_healthy

  # RabbitMQ - Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mlops-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service (NestJS)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: mlops-api
    # Try to generate migration (ignore if no changes), then run migrations, then start
    command: sh -c "pnpm run start:dev --preserveWatchOutput"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: mlops_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_BUCKET_NAME: mlops-content
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Frontend Service (Vite/React)
  front:
    build:
      context: ./apps/front
      dockerfile: Dockerfile
    container_name: mlops-front
    ports:
      - "5173:5173"
    volumes:
      - ./apps/front:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000

  # Prediction Service (Python)
  mlflow:
    build:
      context: ./docker
      dockerfile: MLFlow.Dockerfile
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlops_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  prediction-service:
    build:
      context: ./apps/prediction-service
      dockerfile: Dockerfile
    volumes:
      - ./apps/prediction-service:/app
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_started
    deploy:
      replicas: 1

  minio:
    image: minio/minio
    container_name: mlops-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Service éphémère pour créer le bucket au démarrage
  create-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/mlflow;
      mc anonymous set download myminio/mlflow;
      mc mb --ignore-existing myminio/mlops-content;
      mc anonymous set download myminio/mlops-content;
      exit 0;
      "
    
  # Seeder Service (Seeds models on startup)
  seeder:
    build:
      context: ./apps/seeder
      dockerfile: Dockerfile
    container_name: mlops-seeder
    volumes:
      - ./apps/seeder/models:/app/models
      - ./apps/seeder/seed.py:/app/seed.py
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    depends_on:
      mlflow:
        condition: service_started
      minio:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data: